name: Development source checkpoint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkpoint:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source at the exact reviewed commit
        run: |
          mkdir -p /tmp/source-checkpoint
          git rev-parse HEAD > /tmp/source-checkpoint/COMMIT
          git archive --format=tar.gz --output=/tmp/source-checkpoint/source.tgz HEAD
          cd /tmp/source-checkpoint
          sha256sum source.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-checkpoint
          path: /tmp/source-checkpoint/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
