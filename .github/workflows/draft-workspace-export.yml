name: Export draft verification workspace

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/draft-workspace-export.yml']

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == 'JeffreyNijs/hey-api-builders' && github.head_ref == 'chat/standard-schema-core-20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix tests/compatibility/typebox --ignore-scripts --no-audit --no-fund
      - name: Archive only project files and installed dependencies
        run: |
          git ls-files -z > /tmp/project-files
          tar --null -T /tmp/project-files -czf /tmp/project-source.tgz
          tar -czf /tmp/project-dependencies.tgz node_modules tests/compatibility/typebox/node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: draft-verification-workspace
          path: |
            /tmp/project-source.tgz
            /tmp/project-dependencies.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
