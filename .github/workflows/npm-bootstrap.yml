name: Prepare provenance-backed first publication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-bootstrap
  cancel-in-progress: false

jobs:
  portable:
    if: github.repository == 'JeffreyNijs/mimlet' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/runtime-compatibility.yml
    permissions:
      contents: read

  prepare:
    if: github.repository == 'JeffreyNijs/mimlet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm audit:production
      - run: pnpm test:examples
      - run: node scripts/test-browser.mjs --install
      - name: Retain browser diagnostics, including failed startup
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-browser-diagnostics
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm docs:build
      - run: pnpm docs:test
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-verified-packages
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    needs: [prepare, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bootstrap-verified-packages
          path: release
          digest-mismatch: error
      - name: Install the isolated signing runtime without product lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/mimlet-attestor" --ignore-scripts --no-audit --no-fund npm@11.19.0
      - name: Sign every verified package with the GitHub workflow identity
        run: node scripts/bootstrap-release.mjs attest "$RUNNER_TEMP/mimlet-attestor/node_modules/npm" release provenance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mimlet-first-publication
          path: |
            release/
            provenance/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
