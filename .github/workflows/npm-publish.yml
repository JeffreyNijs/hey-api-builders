name: Publish to npm

on:
  release:
    types: [published]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Verify release and pack
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${VERSION}"
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          FILENAME="hey-api-builders-${VERSION}.tgz"
          test -f "release/${FILENAME}"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable package artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Download verified package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: release
          digest-mismatch: error
      - name: Verify package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARBALL: release/${{ needs.prepare.outputs.filename }}
        run: |
          test -f "$TARBALL"
          SPEC="$(
            tar -xOf "$TARBALL" package/package.json |
              node -e 'let data = ""; process.stdin.on("data", (chunk) => (data += chunk)).on("end", () => { const pkg = JSON.parse(data); process.stdout.write(`${pkg.name}@${pkg.version}`); });'
          )"
          test "$SPEC" = "hey-api-builders@${RELEASE_TAG#v}"
      - name: Check whether the version already exists
        id: registry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if npm view "hey-api-builders@${RELEASE_TAG#v}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.exists != 'true'
        env:
          TARBALL: release/${{ needs.prepare.outputs.filename }}
        run: npm publish "$TARBALL" --access public --ignore-scripts
