name: Prepare browser dependency lock

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prepare-toolkit-locks.yml'
      - 'tests/browser/package.json'

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chat/standard-schema-core-20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - run: npm install --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Export the resolver output without writing to the branch
        run: |
          mkdir -p /tmp/browser-lock
          cp tests/browser/package-lock.json /tmp/browser-lock/
          git rev-parse HEAD > /tmp/browser-lock/COMMIT
          tar -C tests/browser -czf /tmp/browser-lock/dependencies.tgz node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-dependency-lock
          path: /tmp/browser-lock/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
