name: Recover schema candidate

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/recover-schema-candidate.yml']

permissions:
  contents: read

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chat/standard-schema-core-20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive the existing unmerged candidate without modifying any branch
        run: |
          mkdir -p /tmp/schema-recovery
          git archive --format=tar.gz --output=/tmp/schema-recovery/current.tgz HEAD
          git rev-parse HEAD > /tmp/schema-recovery/COMMIT
          git fetch --no-tags --depth=1 origin d000a2480fa08ce28a4eee2e5e4f832a7941df72
          test "$(git rev-parse FETCH_HEAD)" = d000a2480fa08ce28a4eee2e5e4f832a7941df72
          git archive --format=tar.gz --output=/tmp/schema-recovery/candidate.tgz FETCH_HEAD
          cd /tmp/schema-recovery
          sha256sum current.tgz candidate.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-candidate-recovery
          path: /tmp/schema-recovery/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
