name: Prepare schema draft artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == 'JeffreyNijs/hey-api-builders' && github.head_ref == 'chat/standard-schema-core-20260929'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --prefix tests/compatibility/typebox --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Correct the options-test transcription before formatting
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'packages/test-builders/test/hardening.test.mjs';
          const source = readFileSync(path, 'utf8');
          writeFileSync(path, source.replace('assert.deepEqual(received, received);', 'assert.deepEqual(received, options);'));
          JS
      - run: pnpm exec eslint . --fix
      - run: pnpm exec prettier --write . --ignore-unknown
      - name: Commit only the draft's generated formatting and fixture lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/test-builders packages/test-builders-typebox packages/test-builders-typebox-legacy scripts/test-core.mjs scripts/test-typebox.mjs tests/compatibility/typebox package.json docs/schema-independent-builders.md docs/product-roadmap.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: format schema draft and lock native compatibility fixtures'
          git push "https://x-access-token:${GH_TOKEN}@github.com/JeffreyNijs/hey-api-builders.git" HEAD:refs/heads/chat/standard-schema-core-20260929
