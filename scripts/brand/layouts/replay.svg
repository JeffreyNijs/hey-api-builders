<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A saved failing case reproduces the same failure</title><desc id="desc">A saved checkout case expects 2 cents but charges 1 cent, failing an equal-charge assertion. Replaying with the saved replay record and matching fingerprint, provider/version and configuration produces the same values and undercharge failure.</desc>
<rect width="640" height="360" rx="22" fill="#faf7ee"/>
<text x="24" y="42" fill="#152725" font-size="23" font-weight="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Bring the same failure back.</text>
<g transform="translate(554 1) scale(.5)"><!-- mascot --></g>
<rect x="20" y="79" width="246" height="167" rx="14" fill="#faf7ee" stroke="#152725" stroke-width="2"/><text x="36" y="110" fill="#152725" font-size="21" font-weight="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Saved failing case</text><text x="36" y="149" fill="#152725" font-size="21" font-weight="550" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">Expected: 2¢</text><text x="36" y="181" fill="#152725" font-size="21" font-weight="550" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">Charged: 1¢</text><rect x="34" y="199" width="218" height="32" rx="8" fill="#f9d5ca" stroke="none" stroke-width="2"/><text x="143" y="221" fill="#152725" font-size="17" font-weight="650" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">FAIL · undercharged</text><rect x="374" y="79" width="246" height="167" rx="14" fill="#faf7ee" stroke="#152725" stroke-width="2"/><text x="390" y="110" fill="#152725" font-size="21" font-weight="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Replayed case</text><text x="390" y="149" fill="#152725" font-size="21" font-weight="550" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">Expected: 2¢</text><text x="390" y="181" fill="#152725" font-size="21" font-weight="550" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">Charged: 1¢</text><rect x="388" y="199" width="218" height="32" rx="8" fill="#f9d5ca" stroke="none" stroke-width="2"/><text x="497" y="221" fill="#152725" font-size="17" font-weight="650" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">FAIL · undercharged</text><text x="320" y="138" fill="#152725" font-size="18" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Replay</text><path d="M284 163H355M346 154L355 163L346 172" fill="none" stroke="#152725" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="270" width="600" height="67" rx="12" fill="#b6ef86" stroke="none" stroke-width="2"/><text x="320" y="309" fill="#152725" font-size="20" font-weight="650" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Replay record + same versions and configuration</text></svg>
