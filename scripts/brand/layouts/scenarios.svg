<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Related records keep matching IDs</title><desc id="desc">Customer C-42 is referenced by order O-17 through customerId C-42. Line L-03 references that order through orderId O-17.</desc>
