<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Fixtures with shared relationships</title><desc id="desc">A user and an order share the same ID; dependent values stay connected.</desc><g stroke="#152725" stroke-width="3" fill="none"><path d="M205 92H320V176H435M205 272H320V176"/><circle cx="320" cy="176" r="7" fill="#f27b62"/></g><rect x="30" y="42" width="175" height="100" rx="18" fill="#faf7ee" stroke="#152725" stroke-width="2"/><text x="51" y="84" fill="#152725" font-size="22" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">user</text><text x="51" y="113" fill="#152725" font-size="17" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">id: 42</text><rect x="30" y="222" width="175" height="100" rx="18" fill="#faf7ee" stroke="#152725" stroke-width="2"/><text x="51" y="261" fill="#152725" font-size="22" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">order</text><text x="51" y="292" fill="#152725" font-size="17" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">userId: 42</text><g transform="translate(435 87) scale(1.25)"><!-- mascot --></g><text x="376" y="281" fill="#152725" font-size="21" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">Connected by design.</text></svg>
