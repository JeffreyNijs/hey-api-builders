<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Schema rules become matching fixture values</title><desc id="desc">A schema requires an integer age of at least 18, the role admin and a boolean active field. The generated fixture has age 24, role admin and active true.</desc>
<rect width="640" height="360" rx="22" fill="#faf7ee"/>
<text x="24" y="42" fill="#152725" font-size="23" font-weight="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Rules in. Matching data out.</text>
<g transform="translate(554 1) scale(.5)"><!-- mascot --></g>
<rect x="24" y="78" width="252" height="226" rx="14" fill="#faf7ee" stroke="#152725" stroke-width="2"/><rect x="364" y="78" width="252" height="226" rx="14" fill="#faf7ee" stroke="#152725" stroke-width="2"/><text x="44" y="114" fill="#152725" font-size="21" font-weight="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Your schema</text><text x="384" y="114" fill="#152725" font-size="21" font-weight="750" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Generated fixture</text><path d="M24 134H276M364 134H616" stroke="#152725" stroke-opacity=".18"/><text x="44" y="174" fill="#152725" font-size="19" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">age: integer ≥ 18</text><text x="384" y="174" fill="#152725" font-size="19" font-weight="600" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">age: 24</text><text x="44" y="223" fill="#152725" font-size="19" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">role: &quot;admin&quot;</text><text x="384" y="223" fill="#152725" font-size="19" font-weight="600" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">role: &quot;admin&quot;</text><text x="44" y="272" fill="#152725" font-size="19" font-weight="500" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">active: boolean</text><text x="384" y="272" fill="#152725" font-size="19" font-weight="600" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="start">active: true</text><path d="M293 193H345M336 184L345 193L336 202" fill="none" stroke="#152725" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="336" fill="#152725" font-size="20" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">The values satisfy the rules.</text></svg>
